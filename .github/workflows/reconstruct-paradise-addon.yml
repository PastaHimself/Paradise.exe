# trigger v2
name: Reconstruct Paradise addon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-paradise-addon.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-paradise-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/paradise

          cat .reconstruct/overlay/*.txt > /tmp/paradise/overlay.b64
          base64 -d /tmp/paradise/overlay.b64 > /tmp/paradise/overlay.tar.gz
          gzip -t /tmp/paradise/overlay.tar.gz

          GCF=/tmp/paradise/genshin.mcaddon
          if ! curl -fL --retry 3 --retry-delay 2 \
            'https://mediafilez.forgecdn.net/files/7775/720/Genshin%20X%20Craft%20V1-9.mcaddon' \
            -o "$GCF"; then
            curl -fL --retry 3 --retry-delay 2 \
              'https://www.curseforge.com/minecraft-bedrock/addons/genshin-x-craft/download/7775720/file' \
              -o "$GCF"
          fi
          unzip -tq "$GCF"
          mkdir -p /tmp/paradise/genshin
          unzip -q "$GCF" -d /tmp/paradise/genshin

          git clone --depth 1 https://github.com/Mojang/bedrock-samples.git /tmp/paradise/bedrock-samples

          rm -rf addon
          mkdir -p 'addon/Genshin X Craft BP' 'addon/Genshin X Craft RP'
          cp -a /tmp/paradise/bedrock-samples/resource_pack/. 'addon/Genshin X Craft RP/'

          GENS_BP="$(find /tmp/paradise/genshin -type d -name 'Genshin X Craft BP' -print -quit)"
          GENS_RP="$(find /tmp/paradise/genshin -type d -name 'Genshin X Craft RP' -print -quit)"
          test -n "$GENS_BP"
          test -n "$GENS_RP"
          cp -a "$GENS_BP"/. 'addon/Genshin X Craft BP/'
          cp -a "$GENS_RP"/. 'addon/Genshin X Craft RP/'
          tar -xzf /tmp/paradise/overlay.tar.gz -C addon

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          root = Path('addon')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          total = 0
          digest = hashlib.sha256()
          for p in files:
              rel = p.relative_to(root).as_posix().encode()
              data = p.read_bytes()
              total += len(data)
              digest.update(len(rel).to_bytes(4, 'big'))
              digest.update(rel)
              digest.update(len(data).to_bytes(8, 'big'))
              digest.update(data)

          actual = digest.hexdigest()
          print(f'files={len(files)} bytes={total} digest={actual}')
          if len(files) != 4127 or total != 27175883 or actual != 'c0abd6e0e68d5bf2a831917a044f95ef4813ac66cc16e1bed96940365155971c':
              print('Reconstructed tree does not exactly match the uploaded addon; refusing to commit.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit exact extracted addon to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .reconstruct
          rm -f .github/workflows/reconstruct-paradise-addon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A addon .reconstruct .github/workflows/reconstruct-paradise-addon.yml
          git commit -m 'Extract Paradise addon into addon folder'
          git push origin HEAD:main
