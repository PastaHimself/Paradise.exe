name: Apply Review Fixes

on:
  push:
    branches:
      - dimension-visual-upgrade

permissions:
  contents: write

concurrency:
  group: apply-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: dimension-visual-upgrade
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic review fixes
        run: python tools/apply_review_fixes.py

      - name: Verify Yellow Halls syntax
        run: node --check "addon/Genshin X Craft BP/scripts/yellow_halls.js"

      - name: Run visual regression tests
        run: node --test tests/dimension_visual_upgrade.test.mjs

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Review fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "addon/Genshin X Craft BP/scripts/yellow_halls.js"
          git commit -m "fix: restore Yellow Halls flicker on scheduled timeout"
          git push origin HEAD:dimension-visual-upgrade
