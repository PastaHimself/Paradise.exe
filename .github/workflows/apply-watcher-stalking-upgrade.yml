name: Apply Watcher Stalking Upgrade

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/watcher-evidence-stalking-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/watcher-evidence-stalking-v2
          fetch-depth: 0

      - name: Reassemble and verify guarded upgrade bundle
        shell: bash
        run: |
          cat .watcher-upgrade-part-00 .watcher-upgrade-part-01 .watcher-upgrade-part-02 .watcher-upgrade-part-03 .watcher-upgrade-part-04 > /tmp/watcher-upgrade.b64
          base64 --decode /tmp/watcher-upgrade.b64 > /tmp/watcher-upgrade.zip
          echo "a01a999a18c8d294df8d7dc762491e862da79319cf3e415aed4ada4ab0b112cd  /tmp/watcher-upgrade.zip" | sha256sum -c -
          mkdir -p /tmp/watcher-upgrade
          unzip -q /tmp/watcher-upgrade.zip -d /tmp/watcher-upgrade

      - name: Apply guarded upgrade
        shell: bash
        run: |
          node /tmp/watcher-upgrade/Paradise-Watcher-Stalking-Upgrade/apply_upgrade.mjs "$GITHUB_WORKSPACE"

      - name: Run targeted JavaScript tests
        shell: bash
        run: |
          node --test tests/watcher_stalking_intelligence.test.mjs tests/stalker_teleport_governor_fairness.test.mjs

      - name: Check modified script syntax
        shell: bash
        run: |
          node --check "addon/Genshin X Craft BP/scripts/watcher_evidence_model.js"
          node --check "addon/Genshin X Craft BP/scripts/stalker_teleport_governor.js"
          node --check "addon/Genshin X Craft BP/scripts/watcher_stalker.js"

      - name: Remove temporary transport and workflow
        shell: bash
        run: |
          rm -f .watcher-upgrade.b64 .watcher-upgrade-part-00 .watcher-upgrade-part-01 .watcher-upgrade-part-02 .watcher-upgrade-part-03 .watcher-upgrade-part-04
          rm -f .github/workflows/apply-watcher-stalking-upgrade.yml

      - name: Commit upgrade to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add evidence-driven Watcher stalking AI"
          git push origin HEAD:feature/watcher-evidence-stalking-v2
