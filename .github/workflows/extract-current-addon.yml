name: Extract current Paradise addon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-current-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current addon
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='Paradise_0.3_Extreme_Visual_Upgrade_Horror_Events_V2_VHS_Clean_Tape.mcaddon'
          test -f "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          rm -rf addon
          mkdir -p addon
          unzip -q "$ARCHIVE" -d addon
          printf 'Extracted files: '
          find addon -type f | wc -l

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-current-addon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A addon .github/workflows/extract-current-addon.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Extract Paradise addon into addon folder'
          git push origin HEAD:main
